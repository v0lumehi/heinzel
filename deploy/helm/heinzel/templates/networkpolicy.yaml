{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heinzel.fullname" . }}
  labels:
    {{- include "heinzel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heinzel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes: [Ingress]
  ingress:
    # Admin UI and Teams endpoint only via the ingress controller.
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
      ports:
        - { port: 3978 }
        - { port: 3080 }
    # Probes come from the kubelet on the node, which NetworkPolicies do not block.
{{- end }}
