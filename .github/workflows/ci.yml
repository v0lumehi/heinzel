name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Codecov upload without a stored token
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heinzel
          POSTGRES_PASSWORD: heinzel
          POSTGRES_DB: heinzel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heinzel" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgres://heinzel:heinzel@localhost:5432/heinzel_test
      - name: Coverage summary
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| | % |\n|---|---|\n' + ['lines','statements','functions','branches'].map(k => '| ' + k + ' | ' + t[k].pct + ' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false
      - run: pnpm build

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - { name: heinzel, context: . }
          - { name: heinzel-coder, context: coder }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          load: true
          tags: ${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Reviewed exceptions with an expiry date; the file names the reason for each.
          trivyignores: ${{ matrix.image.context }}/.trivyignore

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/heinzel --strict --set secrets.existingSecret=heinzel
      - run: helm template ci deploy/helm/heinzel --set secrets.existingSecret=heinzel > /dev/null
