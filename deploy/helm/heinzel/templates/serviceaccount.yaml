{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "heinzel.serviceAccountName" . }}
  labels:
    {{- include "heinzel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app only talks to the Kubernetes API for coding sessions.
automountServiceAccountToken: {{ .Values.coding.enabled }}
{{- end }}
