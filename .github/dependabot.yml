# Weekly dependency updates, grouped so they arrive as few PRs. New versions still need review (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: npm
    # The root covers the whole pnpm workspace (incl. web/) and updates the shared pnpm-lock.yaml.
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      # All codeql-action steps must run the same version.
      codeql-action: { patterns: ["github/codeql-action/*"] }
  - package-ecosystem: docker
    directories: ["/", "/coder"]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      # Node major versions are changed by hand, to the next LTS line only.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
