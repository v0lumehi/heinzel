apiVersion: v1
kind: Service
metadata:
  name: {{ include "heinzel.fullname" . }}
  labels:
    {{- include "heinzel.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "heinzel.selectorLabels" . | nindent 4 }}
  ports:
    - { name: teams, port: 3978, targetPort: teams }
    - { name: admin, port: 3080, targetPort: admin }
