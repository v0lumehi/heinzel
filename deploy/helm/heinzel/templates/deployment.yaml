{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.values) }}
{{- fail "Set secrets.existingSecret (recommended) or secrets.values with at least DATABASE_URL and LLM_API_KEY." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heinzel.fullname" . }}
  labels:
    {{- include "heinzel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "heinzel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heinzel.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "heinzel.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.coding.enabled }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: heinzel
          image: {{ include "heinzel.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "heinzel.fullname" . }}
            - secretRef:
                name: {{ include "heinzel.secretName" . }}
          ports:
            - { name: teams, containerPort: 3978 }
            - { name: admin, containerPort: 3080 }
            - { name: health, containerPort: 8081 }
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Writable scratch space: npm cache and temp files of stdio MCP servers.
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/node }
            {{- if .Values.mcp }}
            - { name: mcp, mountPath: /config, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
        {{- if .Values.mcp }}
        - name: mcp
          configMap:
            name: {{ include "heinzel.fullname" . }}-mcp
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
