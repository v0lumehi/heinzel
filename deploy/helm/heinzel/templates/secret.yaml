{{- if and (not .Values.secrets.existingSecret) .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heinzel.secretName" . }}
  labels:
    {{- include "heinzel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
