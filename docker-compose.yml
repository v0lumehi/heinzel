services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: heinzel
      POSTGRES_PASSWORD: heinzel
      POSTGRES_DB: heinzel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heinzel"]
      interval: 5s
      timeout: 3s
      retries: 10

  heinzel:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://heinzel:heinzel@postgres:5432/heinzel
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

volumes:
  pgdata:
