apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heinzel.fullname" . }}
  labels:
    {{- include "heinzel.labels" . | nindent 4 }}
data:
  # Inside the pod the servers listen on all interfaces; the Service and ingress decide what is reachable.
  ADMIN_HOST: "0.0.0.0"
  HEALTH_PORT: "8081"
  {{- if .Values.mcp }}
  MCP_CONFIG: /config/mcp.json
  {{- end }}
  {{- if .Values.coding.enabled }}
  CODING_ENABLED: "true"
  CODING_RUNNER: kubernetes
  CODING_IMAGE: {{ printf "%s:%s" .Values.coding.image.repository (default .Chart.AppVersion .Values.coding.image.tag) | quote }}
  CODING_K8S_NAMESPACE: {{ include "heinzel.codingNamespace" . | quote }}
  CODING_PROXY_URL: {{ printf "http://%s-egress.%s.svc.cluster.local:3128" (include "heinzel.fullname" .) .Release.Namespace | quote }}
  {{- with .Values.coding.runtimeClassName }}
  CODING_K8S_RUNTIME_CLASS: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- if .Values.mcp }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heinzel.fullname" . }}-mcp
  labels:
    {{- include "heinzel.labels" . | nindent 4 }}
data:
  mcp.json: {{ .Values.mcp | toPrettyJson | quote }}
{{- end }}
